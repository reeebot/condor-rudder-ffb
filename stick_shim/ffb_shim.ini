; Condor stick force feedback shim - lives next to Condor.exe with dinput8.dll.
; Saved changes apply within half a second, even mid-flight.
; Values are percent of what Condor sends. 100 = unchanged, 150 = half as strong again.
; Effects can't go past the stick's own maximum: when they hit it, ffb_shim.log says CLIPPED.

[Gain]
; centering spring (the airspeed stiffness you feel all the time)
spring=150
; Condor's stall / VNE shake (Stall1 pitch, Stall2 roll)
shake=150
; damper, friction and inertia, if Condor uses any
damper=150
; constant and ramp forces, if Condor uses any
constant=150
; device-wide force gain, only applied if Condor sets one (see FFGAIN lines in the log)
master=100

[Log]
; ffb_shim.log in the Condor folder: every effect Condor creates, changes, starts, stops
enabled=1
; 0 = log only create/start/stop, not every change
log_changes=1
; stop logging changes once the log reaches this size (start/stop still logged)
max_mb=50

[Bridge]
; every log line is also sent here over UDP (127.0.0.1) for the pedal bridge. 0 = off
udp_port=55291
