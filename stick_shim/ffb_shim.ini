; Condor stick force feedback shim - lives next to Condor.exe with dinput8.dll.
; Saved changes apply within half a second, even mid-flight.
; Values are percent. Effects can't go past the stick's own maximum: when they hit it,
; ffb_shim.log says CLIPPED.

[Gain]
; centering spring (the airspeed stiffness you feel all the time). Condor's own spring
; stiffness rises with airspeed and hits DirectInput's 100% cap around 97 kt; at 150% the
; main spring is capped from ~65 kt and the assist spring below carries the rest.
spring=150
; 1 = add a second spring on the same axes for whatever is above the 100% cap, so the boost
; keeps working at high speed. 0 = cap at 100% (use if the stick behaves oddly)
spring_assist=1
; Condor's stall / VNE shake, % of Condor's. Condor runs it at only 10-26% in a stall, so
; there's lots of headroom: 300 = three times Condor's shake (a stall peak then hits ~78%)
shake=300
; 1 = straight multiply. Below 1 (e.g. 0.6) = the first light buffet comes through much
; stronger, so you feel the stall coming earlier; full shake stays the same
shake_curve=1.0
; Condor's own damper / friction / inertia effects, if it ever uses any
damper=150
; constant and ramp forces, if Condor uses any
constant=150
; device-wide force gain, only applied if Condor sets one (see FFGAIN lines in the log)
master=100

[Linkage]
; Effects of our own, always on: moving the stick means moving cables, pulleys and control
; surfaces that have mass - even parked. % of the stick's maximum. 0 = off.
; static friction of the cables and hinges
friction=5
; resistance to speeding up / slowing down the stick: the surfaces' mass
inertia=8
; resistance to moving the stick quickly, when stopped
damper=3
; extra damping that grows with airspeed (air on the surfaces), at ~97 kt and above
damper_airspeed=12

[Break]
; When a wing comes off, Condor cuts its VNE flutter dead. The other wing and the tail are
; still in the airflow, so keep this % of the flutter going, fading as the airspeed drops.
; 0 = stop dead like Condor does.
residual=40

[Log]
; ffb_shim.log in the Condor folder: every effect Condor creates, changes, starts, stops
enabled=1
; 0 = log only create/start/stop, not every change
log_changes=1
; stop logging changes once the log reaches this size (start/stop still logged)
max_mb=50

[Bridge]
; Condor's shake state goes here over UDP (127.0.0.1) every 50 ms for the pedal bridge,
; plus every log line. 0 = off
udp_port=55291
