; Condor stick force feedback shim - lives next to Condor.exe with dinput8.dll.
; Saved changes apply within half a second, even mid-flight.
; Values are percent. Effects can't go past the stick's own maximum: when they hit it,
; ffb_shim.log says CLIPPED.

[Gain]
; centering spring (the airspeed stiffness you feel all the time). 100 = exactly Condor's.
; Condor's stiffness rises with airspeed up to the stick's maximum at ~97 kt. Above 100 the
; boost is tapered: full boost at low speed, the same maximum at ~97 kt.
spring=100
; 1 = straight multiply plus a second spring for whatever is past the maximum: stronger at
; speed, but the force maxes out part way through the travel (soft, then the hard end stop)
spring_assist=0
; Condor's stall / VNE shake, % of Condor's. Condor runs it at only 3-26% in a stall, so
; there's lots of headroom: 350 = 3.5 times Condor's shake
shake=350
; 1 = straight multiply. Below 1 (e.g. 0.6) = the first light buffet comes through much
; stronger, so you feel the stall coming earlier; full shake stays the same
shake_curve=0.9
; the extra shake the pedal bridge sends (airbrake and high-speed buffet), % of what it asks
bridge_buffet=100
; the gust forces the pedal bridge sends (turbulence / airflow bumps), % of what it asks.
; Strength and direction are set in the bridge's settings.ini, [StickGusts]
bridge_gusts=100
; Condor's own damper / friction / inertia effects, if it ever uses any
damper=150
; constant and ramp forces, if Condor uses any
constant=150
; device-wide force gain, only applied if Condor sets one (see FFGAIN lines in the log)
master=100

[Linkage]
; Effects of our own, always on: moving the stick means moving cables, pulleys and control
; surfaces that have mass - even parked. % of the stick's maximum. 0 = off.
; static friction of the cables and hinges. Any friction makes a dead zone around centre
; the spring can't overcome (the stick stops short of centre), so it's off
friction=0
; resistance to speeding up / slowing down the stick: the surfaces' mass. Too much feels
; laggy / delayed
inertia=3
; resistance to moving the stick quickly
damper=4
; extra damping that grows with airspeed. Changing the damping in flight makes the Brunner
; "pop" each time it updates, so leave this at 0
damper_airspeed=0

[Break]
; When a wing comes off, Condor cuts its VNE flutter dead. The other wing and the tail are
; still in the airflow, so keep this % of the flutter going, fading as the airspeed drops.
; 0 = stop dead like Condor does.
residual=40

[Log]
; ffb_shim.log in the Condor folder: every effect Condor creates, changes, starts, stops
enabled=1
; 0 = log only create/start/stop, not every change
log_changes=1
; stop logging changes once the log reaches this size (start/stop still logged)
max_mb=50

[Bridge]
; Condor's shake state goes here over UDP (127.0.0.1) every 50 ms for the pedal bridge,
; plus every log line. 0 = off
udp_port=55291
; the pedal bridge sends stick buffet commands here (airbrakes, high speed). 0 = ignore
cmd_port=55292
