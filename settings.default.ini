; ============================================================================
;  Condor -> Brunner CLS-E rudder force feedback - settings
; ============================================================================
;  Edit and SAVE while flying: changes apply within about 1 second.
;  Exceptions: everything in [Network], plus keys marked (restart).
;  Lines starting with ; are comments. You can also put ; comments after a value.
;  Delete this file to get fresh defaults on the next start.
;
;  Vibration forces are in Brunner internal units. Go up in steps of ~50-100.
; ============================================================================


[Airflow]
; Airflow load on the rudder linkage. There is NO spring: stopped, the pedals are limp
; and stay where you put them. From airflow_starts_kt, airflow centres them:
; stiffness = sf_at_vref * (IAS / v_ref_kt) ^ sf_exponent  (% of your ORIGINAL profile)
; Above sf_knee_kt it keeps building, more gently, until sf_max:
; stiffness = load_at_knee * (IAS / sf_knee_kt) ^ sf_exponent_high
; Curve: 5 kt: 8% | 10: 17% | 20: 40% | 30: 65% | 40: 92% | 50: 120% | 60: 149% |
; 70: 180% (3/4 of max) | 80: 191% | 90: 201% | 100: 211% | 110: 220% | 120: 229% |
; 133+: 240%. More than 100% is fine - it's % of your CLS2Sim profile (max 999).
; CLS2Sim can't go below a 20% load. With profile_divider = 1 that floor holds the load
; at 20% from 3 to 11 kt, then it drops to limp. With profile_divider = 3 the floor is
; ~7%: the curve fades smoothly down to 4.5 kt and the last step to limp is tiny.

; Divide the 9 force values of your CLS2Sim rudder profile by this,
; then set it here; the bridge scales back up so the feel is the same.
; 3 is the sweet spot (max ~3.5 before sf_max x divider hits 999).
; Leave at 1 if you haven't changed the CLS2Sim profile!
profile_divider = 1.0

; Centring and resistance start above this IAS (kt).
airflow_starts_kt = 3.0

; Goes limp again below airflow_starts_kt minus this (kt).
; Stops it flickering on/off right at the threshold.
limp_hysteresis_kt = 1.0

; Stiffness at v_ref_kt (%).
sf_at_vref = 120

; Reference airspeed for sf_at_vref (kt).
v_ref_kt = 50.0

; Curve shape. 2.0 = steep (soft slow, heavy fast). 1.0 = straight line.
; Too stiff at medium-high speed: lower this or sf_at_vref.
; Lower it if slow speeds feel too soft compared to fast.
sf_exponent = 1.2

; Above this IAS the stiffness keeps rising, but more gently (kt).
sf_knee_kt = 70.0

; Curve shape above the knee. 0 = flat (no more increase),
; 1 = keeps rising in a straight line. Raise it for more at high speed.
sf_exponent_high = 0.45

; Hard ceiling on stiffness (%). The curve reaches it at ~133 kt by default.
sf_max = 240

[Linkage]
; The cable linkage still has to move the rudder's mass and fight its friction, so there is
; resistance even when stopped - just no centring. Damping resists moving the pedals
; quickly: a little at rest (the rudder's mass), more with airspeed (air on the rudder).
; Damping uses CLS2Sim's friction-by-velocity: factor x pedal speed (mm/s or deg/s) = force.

; How heavy the pedals feel when limp (stopped / slow), % of your original
; profile. No centring at rest - they stay where you put them.
limp_load_pct = 20.0

; Damping factor when stopped. 0 = none. Try steps of 0.01.
damping_rest = 0.02

; Extra damping factor per 100 kt of airspeed.
damping_per_100kt = 0.06

; Most force the damping can add (N, or Nm on rotational pedals).
damping_limit = 15.0

[YawFeel]
; How the pedals react to sideslip (yaw string).

; stream = the rudder floats with the airflow like a real one: wind from
; the left (yaw string blown right) eases the right pedal forward; in a slip
; you hold, the pushed pedal gets a bit lighter.
; resist = the opposite: the pushed pedal pushes back harder the more you
; yaw (not physical, but easy to feel).
float_mode = stream

; Strength. Spring-centre shift per radian of yaw string
; (15 deg of yaw ~ 0.26 rad x gain). Higher = more yaw pressure.
float_gain_per_rad = 1.0

; Max centre shift, 0-1 of half pedal travel.
float_max = 0.5

; No yaw effect below this IAS (kt). Yaw string is noise when slow.
float_fade_start_kt = 10.0

; Full yaw effect above this IAS (kt).
float_fade_full_kt = 25.0

; How fast the centre can move. Lower = smoother, higher = snappier.
float_rate_per_s = 1.5

; CALIBRATION ONLY - verified for this rig. Leave at 1.
float_sign = 1

[StallFlutter]
; With the stick shim installed (install_stick_shim.bat), the pedals flutter with Condor's
; OWN stall shake - the same moment and strength as the stick, right for every glider and
; ballast. Without it, the IAS model below is used: high AoA = low airspeed for the g
; you're pulling, so flutter starts below an IAS that rises with g.

; auto = Condor's stall shake when the stick shim is running, else the IAS
; model. condor = only Condor's shake. ias = always the IAS model.
stall_source = auto

; Condor's shake level (0-10000) that gives full pedal flutter. A
; normal stall peaks around 2600 and settles at 1000-1800 while
; stalled. Lower = pedals reach full flutter sooner.
condor_stall_full_gain = 2500

; 1 = pedal flutter follows Condor's shake linearly. 2 = lighter at
; first, full only at Condor's strongest shake.
condor_stall_curve = 1.0

; Flutter onset IAS at 1 g (kt). 0 = off. Set it to the IAS where
; the STICK starts to flutter; the pedals then fade in just after.
buffet_onset_kt = 36.0

; Flutter builds to full strength this many kt below onset.
buffet_band_kt = 8.0

; Ramp shape. 1 = linear. 2 = barely-there at first, then builds to a
; full rumble. 3 = even later and more sudden at the end.
buffet_curve = 1.6

; true = onset x sqrt(g), so you also get flutter in tight turns.
buffet_g_scaling = true

; Flutter strength at full.
buffet_force_max = 260

; Flutter period (ms). Lower = faster, buzzier shake. Min 10.
buffet_interval_ms = 50

; Extra fast buzz layered on top as you get deep into the stall
; (kicks in late, full at the bottom of the band). 0 = off.
buffet_buzz_force_max = 140

; Buzz period (ms).
buffet_buzz_interval_ms = 25

[GroundRumble]
; Rumble while rolling on the ground. Needs ExtendedData=1 in Condor's UDP.ini.

; true / false.
ground_vib_enable = true

; Rumble strength at full speed on a normal surface.
ground_vib_force_max = 250

; Ground speed where rumble reaches full strength (kt).
ground_vib_full_kt = 45.0

; No rumble below this ground speed (kt).
ground_vib_min_kt = 2.0

; Rumble period at low speed (ms).
ground_vib_interval_slow_ms = 70

; Rumble period at full speed (ms). Lower = faster buzz.
ground_vib_interval_fast_ms = 30

; How much Condor's surface roughness changes the rumble.
; Strength x (0.5 + gain x roughness), clamped 0.3x-1.5x.
ground_roughness_gain = 1.0

; Wheel height (m) below which you count as on the ground.
ground_wheel_height_m = 0.2

[Airbrakes]
; Airbrake buffet on the pedals, stronger with speed. Condor doesn't send airbrake
; position, so the bridge reads your airbrake lever directly.
; Run lever_setup.bat once to fill in the lever (device, axis, closed/open values).

; true / false.
airbrake_enable = true

; The lever's controller (VID_xxxx&PID_xxxx). Set by lever_setup.bat.
airbrake_device = 

; The lever's axis: X Y Z R U or V. Set by lever_setup.bat.
airbrake_axis = 

; Raw axis value with airbrakes closed. Set by lever_setup.bat.
airbrake_closed_raw = 0

; Raw axis value with airbrakes fully out. Set by lever_setup.bat.
airbrake_open_raw = 65535

; Lever travel ignored at the closed end (0-0.5).
airbrake_deadzone = 0.05

; Buffet strength at full airbrakes at airbrake_vib_full_kt.
airbrake_vib_force_max = 240

; IAS where airbrake buffet reaches full strength (kt).
airbrake_vib_full_kt = 110.0

; No airbrake buffet below this IAS (kt).
airbrake_vib_min_kt = 15.0

; Share of the full buffet you still feel at low speed (0-1).
airbrake_vib_low_frac = 0.3

; Build-up shape. Below 1 = most of it early (60 kt ~ 80% by
; default), still growing to full at airbrake_vib_full_kt. 1 = linear.
airbrake_vib_curve = 0.4

; Buffet period (ms). Lower = faster, buzzier.
airbrake_vib_interval_ms = 60

[HighSpeedBuffet]
; Buzz that creeps in at high speed and builds hard toward VNE. VNE varies by glider
; (roughly 135-150 kt); set hs_buffet_full_kt near the VNE of the glider you fly.

; Buffet starts above this IAS (kt). 0 = off.
hs_buffet_onset_kt = 115.0

; Full strength at this IAS (kt) - put it near VNE.
hs_buffet_full_kt = 145.0

; Strength at full.
hs_buffet_force_max = 140

; Build-up shape. >1 = creeps in then builds hard near VNE. 1 = linear.
hs_buffet_curve = 1.5

; Buzz period (ms). Lower = faster, finer buzz.
hs_buffet_interval_ms = 28

; With the stick shim: Condor's own VNE flutter (it shakes the stick
; just before the wing goes) on the pedals, at full. 0 = off.
condor_vne_force_max = 260

; VNE flutter period (ms).
condor_vne_interval_ms = 50

[StickBuffet]
; With the stick shim installed, the bridge also shakes the STICK for things Condor
; doesn't: airbrake buffet (same speed curve as the pedals' airbrake buffet) and the
; high-speed buffet. % of the stick's maximum force. 0 = off.

; Stick buffet at full airbrakes and airbrake_vib_full_kt.
stick_airbrake_buffet = 30

; Stick buffet at hs_buffet_full_kt.
stick_hs_buffet = 25

; Shake period (ms). Lower = faster, finer.
stick_buffet_period_ms = 70

[StickGusts]
; With the stick shim: turbulence and airflow as forces, not stiffness. A gust that
; bumps the load factor pushes the stick against it (and so does your own pull-up,
; briefly, like a real stick); a roll gust pushes the stick against the roll. Only
; quick changes count - steady turns and trim don't.

; % of the stick's max force per 1 g of change. 0 = off.
stick_gust_pitch_per_g = 12.0

; % per deg/s of roll-rate change. 0 = off.
stick_gust_roll_per_dps = 0.3

; Most force a gust can add, % of max.
stick_gust_max = 15.0

; Load-factor changes smaller than this (g) add nothing, so the
; stick sits dead still in smooth air instead of wiggling
; around centre. Bigger bumps come through (minus this).
stick_gust_pitch_deadband_g = 0.08

; Same for roll-rate changes (deg/s).
stick_gust_roll_deadband_dps = 3.0

; 1 or -1. Pulling up should push the stick forward against your
; hand. Wrong sign = the stick 'sticks' wherever you put it near
; centre (it holds itself there). -1 on Rebot's CLS-E.
stick_gust_pitch_sign = -1

; 1 or -1. Rolling in should push the stick back against your
; hand; if it drags it further into the roll, use -1.
stick_gust_roll_sign = 1

; Changes slower than this (s) are ignored.
stick_gust_highpass_s = 0.7

; Smoothing (s) of Condor's data.
stick_gust_smooth_s = 0.05

[StructuralFailure]
; When a wing comes off (the stick shim sees Condor cut its VNE flutter, or Condor shows a
; violent, sustained roll at speed), the flutter drops suddenly - but the tail and the other
; wing are still in the airflow, so some keeps going, fading as you slow down.

; true / false.
failure_detect = true

; Share of the flutter that keeps going after the break (0-1).
; 0 = everything stops dead (what Condor's own stick does).
failure_residual = 0.4

; Roll rate (deg/s) that counts as uncontrolled. Normal flying stays
; well under 60; a lost wing rolls at 120-150.
failure_rollrate_dps = 90.0

; How long the roll rate must stay that high (s).
failure_hold_s = 0.4

; Only above this IAS (kt), so spins don't count.
failure_min_kt = 60.0

; An altitude jump bigger than this (m) means a new flight.
failure_reset_alt_jump_m = 50.0

[Turbulence]
; Optional airborne vibration from Condor's turbulence strength. 0 = off.

; Vibration force per unit of turbulence.
turb_vib_force_per_unit = 0.0

; Turbulence vibration period (ms).
turb_vib_interval_ms = 90

[Advanced]
; Leave these alone unless something feels wrong.

; Safety cap on any vibration force sent to the pedals.
vib_force_cap = 400

; Airspeed smoothing (s). Higher = smoother, laggier stiffness changes.
ias_tau_s = 0.15

; Yaw string smoothing (s). Higher = less twitchy yaw feel.
yaw_tau_s = 0.12

; No new Condor data for this long -> pedals go neutral (s).
stale_after_s = 0.5

; Re-assert everything to CLS2Sim this often (s), one item per tick so
; it never arrives as a burst. Only matters if you hit Apply in
; CLS2Sim's Profile Manager mid-flight. Short intervals (2 s) gave
; a periodic stutter in VR.
resend_all_every_s = 30.0

; (restart) Update rate (Hz).
tick_hz = 30

; (restart) 0 = off. >0: CLS2Sim STOPS the pedals if this app dies.
watchdog_ms = 0

[Network]
; (restart) Connection settings. Changes here need a restart of this app.

; Interface to listen on for Condor UDP.
condor_listen_host = 0.0.0.0

; Must match Port= in Condor's UDP.ini.
condor_listen_port = 55278

; Relay Condor packets to other apps, comma-separated host:port. Blank = none.
forward_to = 

; Machine running CLS2Sim.
cls2sim_host = 127.0.0.1

; CLS2Sim remote-control UDP port.
cls2sim_port = 15090

; true only if 'Message Identifier' is ticked in CLS2Sim settings.
cls2sim_msg_id = false

; Reply timeout for CLS2Sim requests (s).
cls2sim_timeout_s = 0.25

; Which Brunner axis to drive. 0x4 = rudder.
axis_mask = 0x4

; UDP port the stick shim sends Condor's shake on (udp_port in
; ffb_shim.ini). 0 = ignore the shim.
shim_udp_port = 55291

; UDP port the stick shim takes buffet commands on (cmd_port in
; ffb_shim.ini). 0 = don't send.
shim_cmd_port = 55292
